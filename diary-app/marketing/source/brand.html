<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/local.css">
<style>
*{margin:0;box-sizing:border-box} body{font-family:Rubik,sans-serif;color:#F4F1FF;background:transparent}
.card{display:none;position:relative;overflow:hidden}
body[data-v="wordmark"] #wordmark, body[data-v="feature"] #feature, body[data-v="wordmark-light"] #wordmarkL, body[data-v="square"] #square{display:flex} body[data-v="demobg"] #demobg{display:flex}
#wordmark,#wordmarkL{width:1600px;height:600px;align-items:center;justify-content:center;gap:56px}
#wordmark{background:radial-gradient(120% 120% at 70% 30%,#3B1D8F,#1B1240 55%,#0C0920)}
#wordmarkL{background:#FFFFFF;color:#2E1065}
.logo{width:360px;height:360px;border-radius:86px;box-shadow:0 30px 90px rgba(139,92,246,.5)}
.name{font-size:170px;font-weight:800;line-height:1}
.tag{font-size:50px;color:#C9C2EE;margin-top:18px} #wordmarkL .tag{color:#7C3AED}
#feature{width:1024px;height:500px;background:radial-gradient(120% 140% at 80% 20%,#5B21B6,#1B1240 60%,#0C0920);align-items:center;padding:0 70px;gap:40px}
#feature .logo{width:220px;height:220px;border-radius:52px}
#feature .name{font-size:96px} #feature .tag{font-size:34px;line-height:1.35}
#square{width:1080px;height:1080px;background:radial-gradient(120% 120% at 50% 25%,#3B1D8F,#1B1240 55%,#0C0920);flex-direction:column;align-items:center;justify-content:center;text-align:center}
#square .name{font-size:150px;margin-top:50px} #square .tag{font-size:52px;line-height:1.35;max-width:880px}
em{font-style:normal;color:#F9A8D4}
</style></head><body data-v="wordmark">
<div class="card" id="wordmark"><img class="logo" src="logo.png"><div><div class="name">היומן שלי</div><div class="tag">היומן שמכיר אותך <em>באמת</em></div></div></div>
<div class="card" id="wordmarkL"><img class="logo" src="logo.png"><div><div class="name">היומן שלי</div><div class="tag">היומן שמכיר אותך באמת</div></div></div>
<div class="card" id="feature"><img class="logo" src="logo.png"><div><div class="name">היומן שלי</div><div class="tag">מספרים בקול איך היה היום.<br>הוא זוכר את <em>האנשים שלך</em> — לתמיד.</div></div></div>
<div class="card" id="square"><img class="logo" src="logo.png" style="width:380px;height:380px;border-radius:90px"><div class="name">היומן שלי</div><div class="tag">החבר שמקשיב לך כל ערב<br>ו<em>זוכר את האנשים שלך</em></div></div>
<div class="card" id="demobg" style="width:1080px;height:1920px;background:radial-gradient(120% 80% at 50% 10%,#3B1D8F,#1B1240 50%,#0C0920);flex-direction:column;align-items:center">
<div style="display:flex;align-items:center;gap:26px;margin-top:70px"><img src="logo.png" style="width:120px;height:120px;border-radius:30px"><div class="name" style="font-size:84px">היומן שלי</div></div>
<div style="position:absolute;top:244px;width:752px;height:1592px;left:164px;border-radius:64px;background:#2D2459;box-shadow:0 40px 120px rgba(0,0,0,.6)"></div>
<div class="tag" style="position:absolute;bottom:22px;font-size:40px">בקרוב ב־<bdi>Google Play</bdi> וב־<bdi>App Store</bdi></div>
</div></body></html>
