<!doctype html><html><head><meta charset="utf-8">

</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.measure = async (name) => {
  const g = await new GLTFLoader().loadAsync(name + '.glb');
  const root = g.scene; root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root); const h = box.max.y - box.min.y;
  let mesh; root.traverse((o) => { if (o.isSkinnedMesh && !mesh) mesh = o; });
  const sk = mesh.skeleton; const bi = (n) => sk.bones.findIndex((b) => b.name === n);
  const handSet = new Set(['L_Hand','R_Hand','L_ForearmTwist02','R_ForearmTwist02'].map(bi));
  const headI = bi('Head'); const footSet=new Set(['L_Foot','R_Foot','L_ToeBase','R_ToeBase'].map(bi)); const feet=[];
  const pos = mesh.geometry.attributes.position, si = mesh.geometry.attributes.skinIndex, sw = mesh.geometry.attributes.skinWeight;
  const hands = [], heads = [];
  for (let i = 0; i < pos.count; i++) {
    let best = -1, bw = 0; for (let k = 0; k < 4; k++) { const w = sw.getComponent(i, k); if (w > bw) { bw = w; best = si.getComponent(i, k); } }
    if (handSet.has(best)) hands.push(i); else if (best === headI) heads.push(i); else if (footSet.has(best)) feet.push(i);
  }
  const v = new THREE.Vector3();
  const mixer = new THREE.AnimationMixer(root);
  const res = {};
  const headBone = sk.bones[headI];
  for (const clip of g.animations) {
    mixer.stopAllAction(); const act = mixer.clipAction(clip); act.play();
    let floor = 0, headHit = 0, worst = 0, sink=-1; const N = 24;
    for (let f = 0; f < N; f++) {
      mixer.setTime((f / (N - 1)) * clip.duration * 0.999); root.updateMatrixWorld(true);
      // head sphere in world space
      const hb = new THREE.Box3(); for (const i of heads) { mesh.getVertexPosition(i, v); hb.expandByPoint(v.applyMatrix4(mesh.matrixWorld)); }
      const c = hb.getCenter(new THREE.Vector3()); const sz = hb.getSize(new THREE.Vector3());
      const hp = headBone.getWorldPosition(new THREE.Vector3());
      let minY = Infinity, inHead = 0;
      for (let j = 0; j < hands.length; j += 3) { const i = hands[j]; mesh.getVertexPosition(i, v); v.applyMatrix4(mesh.matrixWorld);
        minY = Math.min(minY, v.y);
        const dx = (v.x - c.x) / (sz.x * 0.42), dy = (v.y - c.y) / (sz.y * 0.42), dz = (v.z - c.z) / (sz.z * 0.42);
        if (dx*dx + dy*dy + dz*dz < 1) inHead++; }
      let fy=Infinity; for (let j=0;j<feet.length;j+=3){mesh.getVertexPosition(feet[j],v);v.applyMatrix4(mesh.matrixWorld);fy=Math.min(fy,v.y);} sink=Math.max(sink,(box.min.y-fy)/h); const fl = (Math.min(fy,box.min.y) - minY) / h; if (fl > 0.01) floor++; worst = Math.max(worst, fl);
      if (inHead > 3) headHit++;
    }
    res[clip.name] = { floor, worst: +worst.toFixed(3), head: headHit, sink:+sink.toFixed(3) };
  }
  return res;
};
window.ok = true;
</script></body></html>
