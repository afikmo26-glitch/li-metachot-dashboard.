name = "diary-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set in the Cloudflare dashboard → Settings → Variables and Secrets):
#   ANTHROPIC_API_KEY  – from console.anthropic.com (Claude), or
#   GEMINI_API_KEY     – from aistudio.google.com (used when there is no Claude key)
#   APP_KEY            – any long random password; type the same one in the app settings

# Password recovery (optional). Create a KV namespace in the dashboard (Storage & Databases → KV),
# then bind it to this Worker as CODES (Settings → Bindings), or uncomment and fill in its id:
# [[kv_namespaces]]
# binding = "CODES"
# id = "<your KV namespace id>"
#
# Recovery secrets:
#   RESEND_API_KEY, MAIL_FROM                          – email codes (resend.com)
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM – SMS codes (twilio.com)
